<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טוען אתר...</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f7f8fc;
            color: #171923;
        }
        .loader { text-align: center; }
        .spinner {
            border: 4px solid #e7e9ef;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #fca5a5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 500px;
            text-align: center;
        }
        .error-box h2 { color: #b91c1c; margin-top: 0; }
        .error-box p { color: #4b5563; line-height: 1.6; }
        .error-box a {
            display: inline-block;
            margin-top: 10px;
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
        }
        iframe {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>טוען את האתר שלך...</p>
    </div>
    <div id="error-container" style="display:none;"></div>

    <script>
        async function loadSite() {
            try {
                // 1. זיהוי שם המשתמש מתוך כתובת האתר
                const hostname = window.location.hostname; // לדוגמה: TheUserWeb.artsiter.extra-tag.com
                const parts = hostname.split('.');

                let username = null;
                if (parts.length >= 3 && parts[1] === 'artsiter') {
                    username = parts[0];
                } else {
                    throw new Error("לא זוהה תת-דומיין תקין (פורמט מצופה: WebName.artsiter.extra-tag.com).");
                }

                // 2. טעינת קובץ all_webs.json מהריפו
                // שים לב: הנתיב צריך להיות יחסי לשורש הריפו
                const response = await fetch('/all_webs.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error("לא ניתן לטעון את קובץ האתרים (all_webs.json).");
                }
                const allWebs = await response.json();

                if (!Array.isArray(allWebs)) {
                    throw new Error("מבנה קובץ האתרים אינו תקין.");
                }

                // 3. חיפוש האתר של המשתמש בתוך המערך
                const siteData = allWebs.find(item =>
                    item && typeof item.name === 'string' &&
                    item.name.toLowerCase() === username.toLowerCase()
                );

                if (!siteData || !siteData.code) {
                    throw new Error(`האתר עבור "${username}" לא נמצא במערכת.`);
                }

                // 4. הצגת האתר בתוך iframe מבודד (בטוח יותר מ-document.write)
                const loader = document.getElementById('loader');
                loader.style.display = 'none';

                const iframe = document.createElement('iframe');
                iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
                iframe.srcdoc = siteData.code;
                document.body.appendChild(iframe);

            } catch (error) {
                console.error(error);
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';

                const errorContainer = document.getElementById('error-container');
                errorContainer.style.display = 'block';
                errorContainer.innerHTML = `
                    <div class="error-box">
                        <h2>שגיאה בטעינת האתר</h2>
                        <p>${error.message}</p>
                        <p>אם אתה המשתמש, וודא שהאתר שלך נשמר כראוי במערכת.</p>
                        <a href="https://extra-tag.com">חזור לדף הבית</a>
                    </div>
                `;
            }
        }

        loadSite();
    </script>
</body>
</html>
